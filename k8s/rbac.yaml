# Read-only access for LensGuard when it runs inside the cluster.
apiVersion: v1
kind: Namespace
metadata: {name: lensguard}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: lensguard, namespace: lensguard}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: lensguard-readonly}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "nodes", "events"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: lensguard-readonly}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: lensguard-readonly}
subjects:
  - {kind: ServiceAccount, name: lensguard, namespace: lensguard}
