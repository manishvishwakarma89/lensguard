name: ci
on:
  push: {branches: [main]}
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt}
      - run: pip install -r backend/requirements.txt
      - run: pytest
        working-directory: backend

  build-scan:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker build
        run: docker build -t lensguard-api:${{ github.sha }} backend
      - name: Trivy scan (JSON report)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: lensguard-api:${{ github.sha }}
          format: json
          output: trivy-report.json
          severity: CRITICAL,HIGH
          exit-code: "0"
      - uses: actions/upload-artifact@v4
        with: {name: trivy-report, path: trivy-report.json}
      - name: Send report to LensGuard (optional)
        if: ${{ vars.LENSGUARD_URL != '' }}
        run: curl -fsS -F "file=@trivy-report.json" "${{ vars.LENSGUARD_URL }}/api/reports/import"
