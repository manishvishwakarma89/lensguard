name: LensGuard CI-CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Allow an active deployment to finish before starting another.
concurrency:
  group: lensguard-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  EB_APPLICATION: lensguard
  EB_ENVIRONMENT: Lensguard-dev
  IMAGE_REPOSITORY: manishvishwa801/lensguard

  # Change to "." if Dockerfile is at the repository root.
  BUILD_CONTEXT: ./backend

jobs:
  build-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Prepare image tag
        run: |
          echo "IMAGE_TAG=sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          mkdir -p reports

      - name: Build Docker image
        run: |
          docker build \
            --tag "$IMAGE_REPOSITORY:$IMAGE_TAG" \
            "$BUILD_CONTEXT"

      - name: Scan source for vulnerabilities and misconfiguration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          format: json
          output: reports/trivy-source.json
          exit-code: "0"

      - name: Scan container image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }}
          scanners: vuln
          format: json
          output: reports/trivy-image.json
          exit-code: "0"

      - name: Enforce image security gate
        shell: python
        run: |
          import json
          import os

          with open("reports/trivy-image.json") as handle:
              report = json.load(handle)

          vulnerabilities = [
              vulnerability
              for result in report.get("Results", [])
              for vulnerability in result.get("Vulnerabilities", [])
          ]

          critical = [
              vulnerability
              for vulnerability in vulnerabilities
              if vulnerability.get("Severity") == "CRITICAL"
          ]

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("## LensGuard image scan\n\n")
              summary.write(f"Total findings: {len(vulnerabilities)}\n\n")
              summary.write(f"Critical findings: {len(critical)}\n")

          if critical:
              raise SystemExit(
                  "Deployment blocked: resolve critical image vulnerabilities."
              )

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push scanned image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: docker push "$IMAGE_REPOSITORY:$IMAGE_TAG"

  deploy:
    needs: build-scan
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: lensguard-${{ github.run_id }}

      - name: Install current AWS CLI
        run: |
          curl --fail --silent --show-error \
            https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip \
            -o /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp/lensguard-aws
          sudo /tmp/lensguard-aws/aws/install \
            --bin-dir /usr/local/bin \
            --install-dir /usr/local/aws-cli \
            --update
          /usr/local/bin/aws --version

      - name: Register and deploy container image
        env:
          AWS_PAGER: ""
        run: |
          set -euo pipefail

          VERSION="gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          IMAGE_TAG="sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          IMAGE_CONFIG=$(jq -n \
            --arg uri "$IMAGE_REPOSITORY:$IMAGE_TAG" \
            '{Source: {Uri: $uri}}')

          /usr/local/bin/aws elasticbeanstalk create-application-version \
            --application-name "$EB_APPLICATION" \
            --version-label "$VERSION" \
            --description "GitHub commit $GITHUB_SHA" \
            --image-configuration "$IMAGE_CONFIG" \
            > /tmp/application-version.json

          /usr/local/bin/aws elasticbeanstalk update-environment \
            --environment-name "$EB_ENVIRONMENT" \
            --version-label "$VERSION" \
            > /tmp/deployment-start.json

          /usr/local/bin/aws elasticbeanstalk wait environment-updated \
            --environment-names "$EB_ENVIRONMENT"

          ACTUAL_VERSION=$(/usr/local/bin/aws elasticbeanstalk describe-environments \
            --environment-names "$EB_ENVIRONMENT" \
            --query 'Environments[0].VersionLabel' \
            --output text)

          if [ "$ACTUAL_VERSION" != "$VERSION" ]; then
            echo "Deployment failed or rolled back: expected $VERSION, got $ACTUAL_VERSION"
            exit 1
          fi

      - name: Check public application health
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
        run: |
          set -euo pipefail

          if [[ "$APP_BASE_URL" != https://* ]]; then
            echo "Set APP_BASE_URL to your application's HTTPS URL."
            exit 1
          fi

          curl --fail --silent --show-error \
            --retry 12 \
            --retry-delay 10 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 20 \
            "${APP_BASE_URL%/}/healthz"

      - name: Collect deployment events
        if: always()
        env:
          AWS_PAGER: ""
        run: |
          mkdir -p deployment-reports

          /usr/local/bin/aws elasticbeanstalk describe-events \
            --environment-name "$EB_ENVIRONMENT" \
            --max-records 100 \
            --output json \
            > deployment-reports/beanstalk-events.json

          /usr/local/bin/aws elasticbeanstalk describe-environments \
            --environment-names "$EB_ENVIRONMENT" \
            --query 'Environments[].{Name:EnvironmentName,Status:Status,Health:Health,Version:VersionLabel,Domain:CNAME}' \
            --output json \
            > deployment-reports/environment-status.json

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-events-${{ github.run_id }}
          path: deployment-reports/
          if-no-files-found: warn
          retention-days: 14